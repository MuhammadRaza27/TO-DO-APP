<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO DO APP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="containercard"> <input type="text" name="cards" id="container" placeholder="Enter Your Work">
        <button onclick="submit()">Add</button>
        <div class="d-flex justify-content-center flex-wrap gap-3">
          <div class="col-xl-3 col-md-4 col-sm-10">
            <div class="product-item border p-2">
              <h5>TO DO</h5>
              <div id="card1" class="task-zone"></div>
            </div>
          </div>
          <div class="col-xl-3 col-md-4 col-sm-10">
            <div class="product-item border p-2">
              <h5>Complete</h5>
              <div id="card2" class="task-zone"></div>
            </div>
          </div>
          <div class="col-xl-3 col-md-4 col-sm-10">
            <div class="product-item border p-2">
              <h5>In Progress</h5>
              <div id="card3" class="task-zone"></div>
            </div>
          </div>
        </div>
        
          
         <script src="app.js"></script> 
</body>
</html>
